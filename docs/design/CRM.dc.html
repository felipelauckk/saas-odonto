<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Arcada — CRM</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#17707F}a:hover{color:#125866}
</style>
</helmet>
<div style="min-height: 1000px; background: #F7F6F3; font-family: Inter, system-ui, sans-serif; color: #14181F; display: flex; flex-wrap: wrap">

<nav aria-label="Menu principal" style="flex: 1 1 248px; max-width: 100%; box-sizing: border-box; background: #0C3640; color: #FFFFFF; padding: 22px 14px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<svg width="30" height="30" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="13" fill="#FFFFFF"></rect><path d="M13 33 C13 18.5, 35 18.5, 35 33" fill="none" stroke="#0C3640" stroke-width="4.2" stroke-linecap="round"></path><circle cx="24" cy="33.2" r="2.6" fill="#3FB8A8"></circle></svg>
<span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; letter-spacing: -0.01em">Arcada</span>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); color: #FFFFFF; text-align: left; font-family: Inter, sans-serif">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 600">Clínica Sorriso</span><span style="font-size: 12px; color: rgba(255,255,255,0.72)">Todas as unidades</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="2" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg>
</button>
<button type="button" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 10px; border: 0; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.78); font: 500 13px Inter, sans-serif">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Buscar ou ir para…<span style="margin-left: auto; font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.2)">⌘K</span>
</button>
<sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="padding: 0 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.6)">{{s.title}}</div>
<sc-for list="{{s.items}}" as="n" hint-placeholder-count="3">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: {{n.weight}}; color: {{n.fg}}; background: {{n.bg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>{{n.label}}<sc-if value="{{n.count}}" hint-placeholder-val="{{false}}"><span style="margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #3FB8A8; color: #0C3640; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{n.count}}</span></sc-if></a>
</sc-for>
</div>
</sc-for>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 36px; display: flex; flex-direction: column; gap: 20px">

<header style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 44px; line-height: 1">Captação</h1><span style="font-size: 14px; color: #4A515C">Do primeiro contato até o tratamento fechado</span></div>
<div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center">
<div role="group" aria-label="Origem" style="display: flex; padding: 3px; background: #ECEAE5; border-radius: 10px">
<sc-for list="{{sources}}" as="o" hint-placeholder-count="5"><button type="button" aria-pressed="{{o.pressed}}" style="height: 34px; padding: 0 12px; border: 0; border-radius: 8px; background: {{o.bg}}; font: {{o.weight}} 13px Inter, sans-serif; color: {{o.fg}}; box-shadow: {{o.shadow}}">{{o.label}}</button></sc-for>
</div>
<button type="button" style="height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid #DAD7D0; background: #FFFFFF; font: 600 14px Inter, sans-serif">Formulário do site</button>
<button type="button" style="height: 42px; padding: 0 16px; border-radius: 10px; border: 0; background: #17707F; color: #FFFFFF; font: 600 14px Inter, sans-serif">Novo contato</button>
</div>
</header>

<section aria-label="Resumo da captação" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); background: #FFFFFF; border: 1px solid #E8E6E1; border-radius: 16px; overflow: hidden">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
<div style="padding: 16px 20px; border-right: 1px solid #F0EEEA; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #4A515C">{{k.label}}</span><span style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{k.value}}</span><span style="font-size: 12px; color: {{k.noteColor}}; font-weight: 600">{{k.note}}</span></div>
</sc-for>
</section>

<section aria-label="Funil" style="overflow-x: auto; padding-bottom: 6px">
<div style="display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 14px; min-width: 1150px; align-items: start">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 10px; background: #EFEDE8; border-radius: 16px; padding: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 4px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 999px; background: {{c.dot}}"></span>{{c.title}}</span>
<span style="font-size: 12px; color: #4A515C; font-variant-numeric: tabular-nums">{{c.count}} · {{c.value}}</span>
</div>
<sc-for list="{{c.cards}}" as="k" hint-placeholder-count="3">
<button type="button" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 12px; border: 1px solid #E8E6E1; background: #FFFFFF; text-align: left; font-family: Inter, sans-serif; color: #14181F; box-shadow: 0 1px 2px rgba(20,24,31,0.04)">
<span style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline"><span style="font-size: 14px; font-weight: 600">{{k.name}}</span><span style="font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums">{{k.value}}</span></span>
<span style="font-size: 12px; color: #4A515C; line-height: 1.4">{{k.interest}}</span>
<span style="display: flex; justify-content: space-between; align-items: center; gap: 6px">
<span style="font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: {{k.srcBg}}; color: {{k.srcFg}}">{{k.source}}</span>
<span style="font-size: 11px; font-weight: 600; color: {{k.ageColor}}">{{k.age}}</span>
</span>
</button>
</sc-for>
<button type="button" style="height: 36px; border-radius: 10px; border: 1px dashed #C9C5BC; background: transparent; font: 500 13px Inter, sans-serif; color: #4A515C">{{c.more}}</button>
</div>
</sc-for>
</div>
</section>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
navSections(active) {
const I = {
Painel: 'M3 3h7v9H3z M14 3h7v5h-7z M14 12h7v9h-7z M3 16h7v5H3z',
Agenda: 'M3 5h18v16H3z M3 10h18 M8 3v4 M16 3v4',
Pacientes: 'M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2 M9 11a4 4 0 100-8 4 4 0 000 8z M22 21v-2a4 4 0 00-3-3.87 M16 3.13a4 4 0 010 7.75',
CRC: 'M21 11.5a8.4 8.4 0 01-9 8.4 8.6 8.6 0 01-4-1L3 20l1.2-4.4A8.4 8.4 0 1121 11.5z',
CRM: 'M3 4h18l-7 8v6l-4 2v-8z',
'Orçamentos': 'M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z M14 3v6h6 M8 13h8 M8 17h5',
Financeiro: 'M3 7h18v13H3z M3 7l3-4h12l3 4 M16 13.5h2',
'Relatórios': 'M4 20V10 M10 20V4 M16 20v-7 M22 20H2',
'Configurações': 'M4 6h10 M18 6h2 M4 12h4 M12 12h8 M4 18h12 M16 4v4 M8 10v4 M16 16v4'
};
const href = { Painel: 'Painel.dc.html', Agenda: 'Agenda.dc.html', Pacientes: 'Pacientes.dc.html', CRC: 'CRC.dc.html', CRM: 'CRM.dc.html', 'Orçamentos': 'Orcamento.dc.html', Financeiro: 'Financeiro.dc.html', 'Relatórios': 'Relatorios.dc.html', 'Configurações': 'Configuracoes.dc.html' };
const item = (label, count) => { const on = label === active; return { label, href: href[label] || '#', icon: I[label], count: count || false, bg: on ? 'rgba(255,255,255,0.12)' : 'transparent', fg: on ? '#FFFFFF' : 'rgba(255,255,255,0.78)', weight: on ? 600 : 500 }; };
return [
{ title: 'Clínica', items: [item('Painel'), item('Agenda'), item('Pacientes')] },
{ title: 'Crescimento', items: [item('CRC', 23), item('CRM')] },
{ title: 'Gestão', items: [item('Orçamentos'), item('Financeiro'), item('Relatórios'), item('Configurações')] }
];
}
renderVals() {
const sources = ['Todas', 'Instagram', 'Google', 'Indicação', 'Site'].map((label, i) => ({ label, pressed: i === 0 ? 'true' : 'false', bg: i === 0 ? '#FFFFFF' : 'transparent', fg: i === 0 ? '#14181F' : '#4A515C', weight: i === 0 ? 600 : 500, shadow: i === 0 ? '0 1px 2px rgba(20,24,31,.08)' : 'none' }));
const S = { Instagram: ['#FBEEF3', '#8F2E57'], Google: ['#ECF2FB', '#264E94'], 'Indicação': ['#EAF5EE', '#1F5C39'], Site: ['#E3F0F1', '#0C3640'], Anúncio: ['#FBF0E3', '#7A400B'] };
const card = (name, interest, source, value, days) => ({ name, interest, source, value, srcBg: S[source][0], srcFg: S[source][1], age: days === 0 ? 'hoje' : (days === 1 ? 'há 1 dia' : 'há ' + days + ' dias'), ageColor: days > 5 ? '#B3261E' : (days > 2 ? '#9A5B0A' : '#4A515C') });
const cols = [
{ title: 'Novo contato', dot: '#9AA1AB', count: 12, value: '', cards: [
card('Patrícia Lemos', 'Quer saber preço de clareamento', 'Instagram', '', 0),
card('Diego Martins', 'Dor no dente, pediu encaixe', 'Google', '', 0),
card('Vanessa Dutra', 'Lente de contato dental', 'Anúncio', '', 3)
], more: '+ 9 contatos' },
{ title: 'Em conversa', dot: '#E3A13B', count: 9, value: '', cards: [
card('Rodrigo Prates', 'Implante, perdeu um molar', 'Indicação', '', 1),
card('Camila Freitas', 'Alinhadores para a filha', 'Instagram', '', 6),
card('Henrique Lopes', 'Revisão e limpeza', 'Site', '', 2)
], more: '+ 6 contatos' },
{ title: 'Avaliação agendada', dot: '#17707F', count: 7, value: '', cards: [
card('Carlos Henrique', 'Avaliação hoje, 15:30', 'Site', '', 0),
card('Larissa Moura', 'Facetas · seg 16/11', 'Instagram', '', 2),
card('Paulo Becker', 'Prótese · ter 17/11', 'Indicação', '', 4)
], more: '+ 4 contatos' },
{ title: 'Orçamento apresentado', dot: '#5B49A8', count: 9, value: 'R$ 38,2 mil', cards: [
card('Fernanda Rocha', 'Implante 36 + enxerto', 'Indicação', 'R$ 6.400', 32),
card('Thiago Martins', 'Alinhadores 18 meses', 'Instagram', 'R$ 9.800', 21),
card('Juliana Prado', 'Facetas 13 a 23', 'Instagram', 'R$ 8.284', 15)
], more: '+ 6 orçamentos' },
{ title: 'Fechou', dot: '#157A4C', count: 17, value: 'R$ 52,6 mil', cards: [
card('Luciana Ferreira', 'Implante 46', 'Indicação', 'R$ 3.600', 3),
card('Mariana Costa', 'Coroa, clareamento e restaurações', 'Indicação', 'R$ 4.380', 13),
card('Bruna Teixeira', 'Ortodontia 24 meses', 'Google', 'R$ 5.760', 9)
], more: '+ 14 fechados' }
];
cols[4].cards.forEach((c) => { c.ageColor = '#4A515C'; });
return {
sections: this.navSections('CRM'),
sources, cols,
kpis: [
{ label: 'Novos contatos em novembro', value: '64', note: '+18% vs. outubro', noteColor: '#157A4C' },
{ label: 'Contato → avaliação', value: '59%', note: 'meta 60%', noteColor: '#4A515C' },
{ label: 'Avaliação → fechamento', value: '45%', note: '+6 p.p.', noteColor: '#157A4C' },
{ label: 'Melhor origem', value: 'Indicação', note: '71% fecham', noteColor: '#157A4C' },
{ label: 'Sem resposta há 3+ dias', value: '6', note: 'responder hoje', noteColor: '#B3261E' }
]
};
}
}
</script>
</body>
</html>
