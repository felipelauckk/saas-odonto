<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Arcada — pacientes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#17707F}a:hover{color:#125866}
</style>
</helmet>
<div style="min-height: 1000px; background: #F7F6F3; font-family: Inter, system-ui, sans-serif; color: #14181F; display: flex; flex-wrap: wrap">

<nav aria-label="Menu principal" style="flex: 1 1 248px; max-width: 100%; box-sizing: border-box; background: #0C3640; color: #FFFFFF; padding: 22px 14px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<svg width="30" height="30" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="13" fill="#FFFFFF"></rect><path d="M13 33 C13 18.5, 35 18.5, 35 33" fill="none" stroke="#0C3640" stroke-width="4.2" stroke-linecap="round"></path><circle cx="24" cy="33.2" r="2.6" fill="#3FB8A8"></circle></svg>
<span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; letter-spacing: -0.01em">Arcada</span>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); color: #FFFFFF; text-align: left; font-family: Inter, sans-serif">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 600">Clínica Sorriso</span><span style="font-size: 12px; color: rgba(255,255,255,0.72)">Todas as unidades</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="2" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg>
</button>
<button type="button" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 10px; border: 0; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.78); font: 500 13px Inter, sans-serif">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Buscar ou ir para…<span style="margin-left: auto; font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.2)">⌘K</span>
</button>
<sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="padding: 0 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.6)">{{s.title}}</div>
<sc-for list="{{s.items}}" as="n" hint-placeholder-count="3">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: {{n.weight}}; color: {{n.fg}}; background: {{n.bg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>{{n.label}}<sc-if value="{{n.count}}" hint-placeholder-val="{{false}}"><span style="margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #3FB8A8; color: #0C3640; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{n.count}}</span></sc-if></a>
</sc-for>
</div>
</sc-for>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 36px; display: flex; flex-direction: column; gap: 20px">

<header style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between">
<div style="display: flex; align-items: baseline; gap: 14px">
<h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 44px; line-height: 1">Pacientes</h1>
<span style="font-size: 15px; color: #4A515C; font-variant-numeric: tabular-nums">1.284 cadastrados</span>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<button type="button" style="height: 42px; padding: 0 16px; border-radius: 10px; border: 1px solid #DAD7D0; background: #FFFFFF; font: 600 14px Inter, sans-serif">Importar planilha</button>
<button type="button" style="height: 42px; padding: 0 16px; border-radius: 10px; border: 0; background: #17707F; color: #FFFFFF; font: 600 14px Inter, sans-serif; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Novo paciente</button>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
<label style="flex: 1 1 360px; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid #DAD7D0; background: #FFFFFF">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A515C" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input type="search" placeholder="Nome, CPF, telefone ou e-mail" aria-label="Buscar paciente" style="flex: 1; border: 0; outline: 0; background: transparent; font: 400 15px Inter, sans-serif">
</label>
<div role="group" aria-label="Filtros rápidos" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button type="button" aria-pressed="{{c.pressed}}" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: 600 13px Inter, sans-serif; display: flex; align-items: center; gap: 6px">{{c.label}}<span style="font-weight: 500; opacity: 0.8; font-variant-numeric: tabular-nums">{{c.n}}</span></button>
</sc-for>
</div>
</div>

<section style="background: #FFFFFF; border: 1px solid #E8E6E1; border-radius: 16px; overflow: hidden">
<div style="overflow-x: auto">
<div style="min-width: 940px">
<div style="display: grid; grid-template-columns: minmax(220px, 2fr) 70px 130px 150px 170px 110px 110px; gap: 14px; padding: 12px 20px; background: #FAF9F7; border-bottom: 1px solid #E8E6E1; font-size: 11px; font-weight: 600; color: #4A515C; text-transform: uppercase; letter-spacing: 0.06em">
<span>Paciente</span><span>Idade</span><span>Última visita</span><span>Próxima consulta</span><span>Situação</span><span style="text-align: right">Em aberto</span><span>Origem</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<a href="Paciente.dc.html" style="display: grid; grid-template-columns: minmax(220px, 2fr) 70px 130px 150px 170px 110px 110px; gap: 14px; align-items: center; padding: 12px 20px; border-top: 1px solid #F0EEEA; text-decoration: none; color: #14181F; font-size: 14px">
<span style="display: flex; align-items: center; gap: 12px; min-width: 0"><span style="width: 36px; height: 36px; border-radius: 11px; background: {{r.avBg}}; color: {{r.avFg}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex: 0 0 auto">{{r.ini}}</span><span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">{{r.name}}</span><span style="font-size: 12px; color: #4A515C; font-variant-numeric: tabular-nums">{{r.phone}}</span></span></span>
<span style="color: #4A515C; font-variant-numeric: tabular-nums">{{r.age}}</span>
<span style="color: #4A515C; font-variant-numeric: tabular-nums">{{r.last}}</span>
<span style="font-variant-numeric: tabular-nums; color: {{r.nextColor}}">{{r.next}}</span>
<span><span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{r.stBg}}; color: {{r.stFg}}"><span style="width: 6px; height: 6px; border-radius: 999px; background: {{r.stFg}}"></span>{{r.status}}</span></span>
<span style="text-align: right; font-variant-numeric: tabular-nums; font-weight: {{r.balWeight}}; color: {{r.balColor}}">{{r.balance}}</span>
<span style="color: #4A515C">{{r.source}}</span>
</a>
</sc-for>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 20px; border-top: 1px solid #E8E6E1; font-size: 13px; color: #4A515C">
<span>Mostrando 1–10 de 1.284</span>
<div style="display: flex; gap: 6px">
<button type="button" style="height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid #DAD7D0; background: #FFFFFF; font: 600 13px Inter, sans-serif; color: #4A515C">Anterior</button>
<button type="button" style="height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid #DAD7D0; background: #FFFFFF; font: 600 13px Inter, sans-serif">Próxima</button>
</div>
</div>
</section>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
navSections(active) {
const I = {
Painel: 'M3 3h7v9H3z M14 3h7v5h-7z M14 12h7v9h-7z M3 16h7v5H3z',
Agenda: 'M3 5h18v16H3z M3 10h18 M8 3v4 M16 3v4',
Pacientes: 'M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2 M9 11a4 4 0 100-8 4 4 0 000 8z M22 21v-2a4 4 0 00-3-3.87 M16 3.13a4 4 0 010 7.75',
CRC: 'M21 11.5a8.4 8.4 0 01-9 8.4 8.6 8.6 0 01-4-1L3 20l1.2-4.4A8.4 8.4 0 1121 11.5z',
CRM: 'M3 4h18l-7 8v6l-4 2v-8z',
'Orçamentos': 'M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z M14 3v6h6 M8 13h8 M8 17h5',
Financeiro: 'M3 7h18v13H3z M3 7l3-4h12l3 4 M16 13.5h2',
'Relatórios': 'M4 20V10 M10 20V4 M16 20v-7 M22 20H2',
'Configurações': 'M4 6h10 M18 6h2 M4 12h4 M12 12h8 M4 18h12 M16 4v4 M8 10v4 M16 16v4'
};
const href = { Painel: 'Painel.dc.html', Agenda: 'Agenda.dc.html', Pacientes: 'Pacientes.dc.html', CRC: 'CRC.dc.html', CRM: 'CRM.dc.html', 'Orçamentos': 'Orcamento.dc.html', Financeiro: 'Financeiro.dc.html', 'Relatórios': 'Relatorios.dc.html', 'Configurações': 'Configuracoes.dc.html' };
const item = (label, count) => { const on = label === active; return { label, href: href[label] || '#', icon: I[label], count: count || false, bg: on ? 'rgba(255,255,255,0.12)' : 'transparent', fg: on ? '#FFFFFF' : 'rgba(255,255,255,0.78)', weight: on ? 600 : 500 }; };
return [
{ title: 'Clínica', items: [item('Painel'), item('Agenda'), item('Pacientes')] },
{ title: 'Crescimento', items: [item('CRC', 23), item('CRM')] },
{ title: 'Gestão', items: [item('Orçamentos'), item('Financeiro'), item('Relatórios'), item('Configurações')] }
];
}
renderVals() {
const chipDefs = [['Todos', '1.284'], ['Em tratamento', '146'], ['Orçamento em aberto', '38'], ['Retorno vencido', '212'], ['Aniversariantes do mês', '97'], ['Arquivados', '61']];
const chips = chipDefs.map(([label, n], i) => ({ label, n, pressed: i === 0 ? 'true' : 'false', bg: i === 0 ? '#0C3640' : '#FFFFFF', fg: i === 0 ? '#FFFFFF' : '#14181F', border: i === 0 ? '#0C3640' : '#DAD7D0' }));
const ST = {
'Em tratamento': ['#E3F0F1', '#0C3640'], 'Em dia': ['#E5F4EC', '#157A4C'], 'Orçamento em aberto': ['#FBF0DD', '#9A5B0A'], 'Retorno vencido': ['#FBF0DD', '#9A5B0A'], 'Parcela vencida': ['#FBE9E7', '#B3261E'], 'Primeira consulta': ['#F0EEEA', '#4A515C']
};
const AV = [['#E3F0F1', '#0C3640'], ['#EFECF9', '#3F3285'], ['#FBF0E3', '#7A400B'], ['#EAF5EE', '#1F5C39']];
const data = [
['Mariana Costa', '(51) 99812-4410', 34, '02/11/2026', 'Seg, 16/11 · 10:00', 'Em tratamento', 'R$ 1.380', 'Indicação'],
['Fernanda Rocha', '(51) 99733-1820', 41, '13/10/2026', 'Sem consulta', 'Orçamento em aberto', '—', 'Instagram'],
['Rafael Souza', '(51) 98455-0921', 29, '14/11/2026', 'Mai/2027 · retorno', 'Em dia', '—', 'Google'],
['Ana Beatriz Lima', '(51) 99120-7781', 16, '17/10/2026', 'Sem consulta', 'Em tratamento', 'R$ 2.400', 'Indicação'],
['Roberto Nunes', '(51) 98761-3302', 57, '14/11/2026', 'Sex, 20/11 · 09:00', 'Em tratamento', '—', 'Passante'],
['Juliana Prado', '(51) 99645-2290', 38, '30/10/2026', 'Sem consulta', 'Orçamento em aberto', '—', 'Instagram'],
['Marcelo Duarte', '(51) 98102-6654', 46, '05/11/2026', 'Sem consulta', 'Parcela vencida', 'R$ 1.590', 'Google'],
['Carlos Henrique', '(51) 99877-4012', 33, 'Hoje', 'Hoje · 15:30', 'Primeira consulta', '—', 'Site'],
['Luciana Ferreira', '(51) 99201-5538', 49, 'Hoje', 'Qui, 03/12 · 14:00', 'Em tratamento', 'R$ 3.600', 'Indicação'],
['Gilberto Ramos', '(51) 98230-1147', 62, '11/03/2026', 'Sem consulta', 'Retorno vencido', '—', 'Indicação']
];
const rows = data.map(([name, phone, age, last, next, status, balance, source], i) => {
const p = name.split(' ');
const av = AV[i % AV.length];
const st = ST[status];
const overdue = status === 'Parcela vencida';
return { name, phone, age: age + ' anos', last, next, nextColor: next === 'Sem consulta' ? '#4A515C' : '#14181F', status, stBg: st[0], stFg: st[1], balance, balColor: overdue ? '#B3261E' : '#14181F', balWeight: balance === '—' ? 400 : 600, source, ini: p[0][0] + p[p.length - 1][0], avBg: av[0], avFg: av[1] };
});
return { sections: this.navSections('Pacientes'), chips, rows };
}
}
</script>
</body>
</html>
